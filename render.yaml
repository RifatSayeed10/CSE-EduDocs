# Render Blueprint: Render → New → Blueprint → pick this GitHub repo.
# Frontend + backend run together as one free Node web service.
# All data (records + uploaded PDFs/images) is stored in MongoDB Atlas, because the
# free Render disk is wiped on every restart/deploy.
services:
  - type: web
    name: cse-edudocs
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: MONGODB_URI            # Atlas connection string (with /research_archive)
        sync: false
      - key: REQUIRE_MONGODB
        value: "true"
      - key: FILE_STORAGE           # keep uploaded files inside MongoDB
        value: mongo
      - key: MAX_UPLOAD_MB
        value: "15"
      - key: PDF_TEXT_ENABLED       # no OCR / no reading inside PDFs
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_DEFAULT_PASSWORD
        sync: false
      - key: SEED_DEMO_DATA
        value: "false"
      - key: AI_PROVIDER_1_NAME
        value: groq
      - key: AI_PROVIDER_1_URL
        value: https://api.groq.com/openai/v1
      - key: AI_PROVIDER_1_KEY
        sync: false
      - key: AI_PROVIDER_1_MODEL
        value: openai/gpt-oss-20b
